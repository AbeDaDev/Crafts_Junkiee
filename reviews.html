<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reviews | Crafts Junkiee</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<div class="bar">Handmade in Orange County, CA · Free shipping on orders over $35</div>
<header>
  <a class="logo" href="/"><img src="./mainlogo.png" alt="Crafts Junkiee"></a>
  <nav><a href="/shop.html">Shop</a><a href="/samples.html">Samples</a><a href="/customize.html#how">Custom orders</a><a href="/reviews.html">Reviews</a></nav>
  <div class="hdr-actions">
    <a class="social" href="https://www.instagram.com/crafts_junkiee/" target="_blank" rel="noopener" aria-label="Crafts Junkiee on Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor"/></svg></a>
    <a class="social" href="mailto:crafts.junkiee@gmail.com" aria-label="Email Crafts Junkiee"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></a>
    <button class="cart" id="cart" aria-live="polite">Cart (0)</button>
  </div>
</header>

<section class="page-top">
  <div class="wrap">
    <p class="crumb"><a href="/">Home</a> / Reviews</p>
    <h1>Reviews</h1>
    <p class="sub" id="rv-summary">What customers are saying about their pieces.</p>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap rv-layout">
    <div>
      <div class="rv-list" id="rv-list" aria-live="polite"></div>
    </div>
    <form class="rv-form" id="write" novalidate>
      <h2>Leave a review</h2>
      <fieldset class="rv-stars">
        <legend>Your rating</legend>
        <div class="rv-stars-row"><input type="radio" id="r5" name="rating" value="5" required><label for="r5" title="5 stars"><span class="vh">5 stars</span>★</label><input type="radio" id="r4" name="rating" value="4" required><label for="r4" title="4 stars"><span class="vh">4 stars</span>★</label><input type="radio" id="r3" name="rating" value="3" required><label for="r3" title="3 stars"><span class="vh">3 stars</span>★</label><input type="radio" id="r2" name="rating" value="2" required><label for="r2" title="2 stars"><span class="vh">2 stars</span>★</label><input type="radio" id="r1" name="rating" value="1" required><label for="r1" title="1 star"><span class="vh">1 star</span>★</label></div>
      </fieldset>
      <label for="rv-name">Name</label>
      <input type="text" id="rv-name" name="name" maxlength="40" autocomplete="given-name" required>
      <label for="rv-product">What did you get? <span class="opt">(optional)</span></label>
      <select id="rv-product" name="product">
        <option value="">Choose one</option>
        <option>Keychains</option><option>DIY Pens</option><option>Glitter</option><option>DTF Prints</option><option>Accessories</option><option>Custom order</option>
      </select>
      <label for="rv-text">Your review</label>
      <textarea id="rv-text" name="text" rows="5" maxlength="1000" required></textarea>
      <div class="hp" aria-hidden="true"><label for="rv-web">Website</label><input type="text" id="rv-web" name="website" tabindex="-1" autocomplete="off"></div>
      <button class="btn" type="submit">Post review</button>
      <p class="rv-msg" id="rv-msg" aria-live="polite"></p>
    </form>
  </div>
</section>
<footer>
  <div class="foot-links">
    <a class="btn" href="https://www.instagram.com/crafts_junkiee/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor"/></svg> Instagram</a>
    <a class="btn alt" href="mailto:crafts.junkiee@gmail.com"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg> Email us</a>
  </div>
  <p>Crafts Junkiee · Orange County, CA · @crafts_junkiee on Instagram and TikTok</p>
</footer>

<script type="module" src="/src/script.js"></script>
<script type="module" src="/src/reviews.js"></script>
</body>
</html>
